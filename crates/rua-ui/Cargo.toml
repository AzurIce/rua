[package]
name = "rua-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[dependencies]
# Note: dx (dioxus-cli) requires its dioxus version to match exactly; 0.7.10
# is the current pairing.
dioxus = { version = "=0.7.10" }
dioxus-flow = { path = "../../../dioxus-flow" }
pulldown-cmark = { version = "0.13", default-features = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "DomRect",
    "DomRectReadOnly",
    "Element",
    "HtmlElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "Location",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "ScrollToOptions",
    "Window",
] }
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
gloo-net = { version = "0.6", features = ["http", "websocket", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
tracing = "0.1"
