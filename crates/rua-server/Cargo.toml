[package]
name = "rua-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rua"
path = "src/main.rs"

[lib]
name = "rua_server"
path = "src/lib.rs"

[dependencies]
rua-graph = { path = "../rua-graph" }
rua-engine = { path = "../rua-engine" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
# script 工具的 JS 解释器（PTC）。fuzz feature 提供 instructions_remaining
# 指令预算（死循环脚本的取消机制）。
boa_engine = { version = "0.22.0", features = ["fuzz"] }

[dev-dependencies]
reqwest.workspace = true
futures.workspace = true
tempfile = "3"
tokio-tungstenite = "0.29"
wiremock = "0.6"
